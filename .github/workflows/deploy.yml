# Builds the catalog and publishes it with GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy catalog

on:
  push:
    branches: [main]
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab
  # Using a Google Sheet? Uncomment to rebuild every day at 06:00 UTC
  # so spreadsheet edits show up without a new commit.
  # schedule:
  #   - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python catalog.py build --out _site
        # To keep the sheet URL out of the repo, store it as a secret and uncomment:
        # env:
        #   CATALOG_SOURCE: ${{ secrets.CATALOG_SOURCE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
